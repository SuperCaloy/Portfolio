version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/node_modules
      - /var/www/vendor
    ports:
      - '5173:5173'
    networks:
      - portfolio-network

  web:
    image: nginx:alpine
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - portfolio-network

  db:
    image: mysql:8.0
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${LOCAL_DB_DATABASE:-portfolio}
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-secret}
      MYSQL_USER: ${LOCAL_DB_USERNAME:-portfolio_user}
    ports:
      - '3306:3306'
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - portfolio-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: portfolio-phpmyadmin
    restart: unless-stopped
    ports:
      - '8080:80'
    environment:
      PMA_HOST: db
      PMA_USER: ${LOCAL_DB_USERNAME:-root}
      PMA_PASSWORD: ${LOCAL_DB_PASSWORD:-secret}
    depends_on:
      - db
    networks:
      - portfolio-network

  phpmyadmin-aiven:
    image: phpmyadmin/phpmyadmin
    container_name: portfolio-phpmyadmin-aiven
    restart: unless-stopped
    ports:
      - '8081:80'
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

volumes:
  dbdata:
    driver: local